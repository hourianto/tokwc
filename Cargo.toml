[package]
name = "tokwc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "local wc-style token counter for OpenAI and Claude models"
license = "MIT"
repository = "https://github.com/hourianto/tokwc"
keywords = ["tokenizer", "tokens", "openai", "claude", "wc"]
categories = ["command-line-utilities", "text-processing"]
readme = "README.md"
include = [
    "/src/**",
    "/tests/**",
    "/docs/**",
    "/README.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/Cargo.toml",
    "/Cargo.lock",
]

[[bin]]
name = "tokwc"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "cli"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:anyhow", "dep:clap", "dep:ignore", "dep:rayon", "dep:serde", "dep:serde_json"]

[package.metadata.docs.rs]
no-default-features = true

[workspace]
members = ["tools/gen-tables"]
default-members = ["."]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0.104"
rustc-hash = "2.1.3"
ruzstd = "0.9.0"
serde_json = "1.0.151"
# Keep the runtime and generator on identical Unicode rules.
unicode-general-category = "=1.1.0"
unicode-normalization = "=0.1.25"

# Selected pedantic, nursery, and restriction lints with actionable findings.
[workspace.lints.clippy]
cast_lossless = "warn"
dbg_macro = "warn"
implicit_clone = "warn"
map_err_ignore = "warn"
match_wildcard_for_single_variants = "warn"
missing_errors_doc = "warn"
must_use_candidate = "warn"
naive_bytecount = "warn"
needless_collect = "warn"
redundant_clone = "warn"
redundant_closure_for_method_calls = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
uninlined_format_args = "warn"
unreadable_literal = "warn"
unused_self = "warn"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true, optional = true }
clap = { version = "4.6.7", features = ["derive", "wrap_help"], optional = true }
ignore = { version = "0.4.33", optional = true }
memchr = "2.8.3"
rayon = { version = "1.12.0", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
rustc-hash.workspace = true
ruzstd.workspace = true
tiktoken = { version = "=4.1.2", default-features = false, features = ["vocab-cl100k_base", "vocab-o200k_base"] }
unicode-general-category.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json.workspace = true
tempfile = "3.27.0"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

# Light optimization avoids copying large Unicode lookup tables on every call.
# Debug symbols, debug assertions, and overflow checks retain their defaults.
[profile.dev]
opt-level = 1
